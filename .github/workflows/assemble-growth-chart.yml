name: Assemble growth chart asset

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/assemble-growth-chart.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble and verify image
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib

          parts = [
              '.image-parts/growth-00a.b64',
              '.image-parts/growth-00b.b64',
              '.image-parts/growth-01.b64',
              '.image-parts/growth-02.b64',
              '.image-parts/growth-03.b64',
              '.image-parts/growth-04.b64',
          ]
          encoded = ''.join(Path(p).read_text().strip() for p in parts)
          assert len(encoded) == 59532, len(encoded)

          data = base64.b64decode(encoded, validate=True)
          assert len(data) == 44648, len(data)

          actual = hashlib.sha256(data).hexdigest()
          expected = '7b7f6d10e31cb9b2754ee8e5f630b4b446f615deb86a52068cecf60245d8c704'
          assert actual == expected, (actual, expected)

          out = Path('images/illustrations/pediatric-growth-progress-chart-800.webp')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(data)
          print(f'verified {out}: {len(data)} bytes sha256={actual}')
          PY

      - name: Commit assembled asset and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .image-parts
          git add images/illustrations/pediatric-growth-progress-chart-800.webp .image-parts
          git commit -m "25 ต.ค. 2569 — เพิ่มกราฟการเจริญเติบโตความละเอียดสูง"
          git push
